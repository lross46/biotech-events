# Temporary: runs the news fetcher on the feature branch to check the feeds. Removed before merge.
name: News feed test
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-news.mjs
      - run: node scripts/check-news.mjs
      - run: node scripts/check-data.mjs
      - run: |
          node -e '
          const n = require("./site/data/news.json");
          const by = {}; for (const i of n.items) by[i.kind] = (by[i.kind] || 0) + 1;
          console.log("by kind", by);
          const c = {}; for (const i of n.items) c[i.guess.cat] = (c[i.guess.cat] || 0) + 1;
          console.log("by guessed category", c);
          console.log("bytes", JSON.stringify(n).length);
          for (const i of n.items.filter((x, k) => k % 25 === 0)) console.log(JSON.stringify(i));
          '
